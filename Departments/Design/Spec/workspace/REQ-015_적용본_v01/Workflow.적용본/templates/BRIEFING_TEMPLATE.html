<!DOCTYPE html>
<!--
  브리핑 서식. 요건·종류·작성 시점은 Workflow/05_인수인계_및_실행명령 「브리핑」,
  위치·이름·버전은 Workflow/07_문서_서식_및_번호 「문서 체계」·「번호와 버전」을 따른다.
  HTML 단일 파일로 작성한다. 스타일은 이 파일 안에 두고 외부 파일·네트워크 자원
  (CDN 글꼴, 스크립트, 원격 이미지 등)을 참조하지 않는다. YAML 머리말을 두지 않는다.
  이 안내 주석과 아래 영역별 안내 주석은 작성할 때 지운다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브리핑: 주제</title>
<style>
  body { margin: 0; padding: 24px; font-family: sans-serif; line-height: 1.6; color: #1f2328; background: #ffffff; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1.15rem; margin: 24px 0 8px; }
  .top { border: 2px solid #1f2328; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
  .top h2 { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  th, td { border: 1px solid #d0d7de; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f6f8fa; }
  code { font-family: monospace; background: #f6f8fa; padding: 0 4px; }
  footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid #d0d7de; font-size: 0.875rem; color: #57606a; }
</style>
</head>
<body>
<main>
  <h1>브리핑: 주제</h1>

  <!-- 맨 위(스크롤 없이 보이는 위치)에 결론과 대표님이 할 일을 둔다. -->
  <section class="top">
    <h2>결론</h2>
    <p>결론을 적는다.</p>
    <h2>대표님이 할 일</h2>
    <ul>
      <li>대표님이 할 일을 적는다. 없으면 「없음」으로 적는다.</li>
    </ul>
  </section>

  <!-- 본문. 종류(조사·승인·진행 현황·기획 브리핑)별 필수 항목은 Workflow/05_인수인계_및_실행명령 「브리핑」의 「종류와 작성 시점」 표를 따른다. -->
  <section>
    <h2>본문</h2>
    <p>종류별 필수 항목을 적는다.</p>
  </section>

  <!-- 작성 정보. 본문 맨 끝에 둔다. -->
  <footer>
    <p>작성 날짜: YYYY-MM-DD</p>
    <p>작성 서비스·세션 식별자와 모델: 세션 식별자(Workflow/05_인수인계_및_실행명령 「비서실 동시 운용」), 모델(확인할 수 없으면 「확인 불가」)</p>
    <p>원천 문서: <code>경로</code></p>
  </footer>
</main>
</body>
</html>
